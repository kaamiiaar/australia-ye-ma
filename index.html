<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3ea" />
    <meta name="description" content="Australia-ye Ma mobile product prototype" />
    <title>Australia-ye Ma | استرالیای ما</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" data-route="home" aria-label="خانه">
          <span class="brand-mark" aria-hidden="true">ما</span>
          <span><b>Australia-ye Ma</b><small>ملبورنِ ما</small></span>
        </button>
        <div class="top-actions">
          <button class="icon-button" id="languageButton" aria-label="Switch to English">EN</button>
          <button class="avatar" data-route="profile" aria-label="پروفایل">ک</button>
        </div>
      </header>

      <main id="app" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="ناوبری اصلی">
        <button class="nav-item active" data-route="home"><span>⌂</span><small data-fa="خانه" data-en="Home">خانه</small></button>
        <button class="nav-item" data-route="explore"><span>⌕</span><small data-fa="جستجو" data-en="Explore">جستجو</small></button>
        <button class="nav-item add-item" data-route="submit"><span>＋</span><small data-fa="ثبت آگهی" data-en="Submit">ثبت آگهی</small></button>
        <button class="nav-item" data-route="saved"><span>♡</span><small data-fa="ذخیره‌ها" data-en="Saved">ذخیره‌ها</small></button>
        <button class="nav-item" data-route="profile"><span>○</span><small data-fa="پروفایل" data-en="Profile">پروفایل</small></button>
      </nav>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
